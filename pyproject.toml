[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lingua-kindle"
version = "0.1.0"
description = "Transforma destaques do Kindle em cartoes enriquecidos para o Anki."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.10,<7",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "respx>=0.21,<1",
]

[project.scripts]
lingua = "lingua.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lingua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
