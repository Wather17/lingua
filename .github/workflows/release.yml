name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require tag to match pyproject version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          test -n "$VERSION"
          test "v$VERSION" = "$GITHUB_REF_NAME"

  build:
    name: Build ${{ matrix.platform }}
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
            source: dist/lingua
            asset: lingua-linux-amd64
          - os: windows-latest
            platform: windows-amd64
            source: dist/lingua.exe
            asset: lingua-windows-amd64.exe
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Run tests
        run: uv run pytest

      - name: Build executable
        run: uv run pyinstaller --clean --noconfirm --onefile --name lingua scripts/lingua_entry.py

      - name: Rename release asset (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release
          mv '${{ matrix.source }}' 'release/${{ matrix.asset }}'

      - name: Rename release asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Move-Item '${{ matrix.source }}' 'release/${{ matrix.asset }}'

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: release/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: "*-amd64"
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Lingua ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
