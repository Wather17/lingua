name: Documentation contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-contract:
    name: Validate JSON and TSV contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON example
        run: python3 -m json.tool entries.example.json >/dev/null

      - name: Validate two-column TSV example
        run: |
          awk -F '\t' 'NF != 2 || $1 == "" || $2 == "" { bad=1 } END { exit (NR == 0 || bad) }' docs/example-output.tsv

      - name: Reject obsolete runtime references
        run: |
          if git grep -n -E 'OPENROUTER|OpenRouter|openrouter|CardID|Vocabulary|Grammar|Audio|select-model|evaluate|My Clippings' -- README.md docs anki entries.example.json; then
            echo 'Encontrada referência funcional ao fluxo antigo.' >&2
            exit 1
          fi

      - name: Check whitespace
        run: git diff --check
